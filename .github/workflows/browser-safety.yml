name: Browser Safety

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: verify-browser-safety
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser verification
        run: npx playwright install --with-deps chromium

      - name: Typecheck and browser metadata safety
        run: npm test

      - name: Event Archive desktop and mobile verification
        run: npm run test:event-archive-ui

      - name: Production build
        run: npm run build

      - name: Mobile navigation and Woohyukmon handoff verification
        env:
          AUTH_SECRET: isolated-browser-safety-not-a-production-secret
          AUTH_TRUST_HOST: "true"
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3301 > /tmp/kline-mobile-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3301/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/mobile-layout.smoke.mjs

      - name: V4 isolation safety
        run: npm run check:v4-isolation
